  navigator.clipboard.writeText(absUrl(href)).then(() => {
    btn.classList.add('copied');
    btn.textContent = '✓ Kopyalandı!';
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.textContent = '🔗 Linki Kopyala';
    }, 2000);
  });
}

const grid = document.getElementById('cardGrid');

CARDS.forEach(c => {
  if (c.separator) {
    const sep = document.createElement('div');
    sep.className = 'section-sep';
    sep.innerHTML = `<div class="section-sep-line"></div><div class="section-sep-title">${c.separator}</div><div class="section-sep-line"></div>`;
    grid.appendChild(sep);
    return;
  }
  const card = document.createElement('div');
  card.className = `pdf-card ${c.color}`;
  const link = c.pdf || c.goto;
  card.innerHTML = `
    <div class="card-top">
      <div class="card-icon">${c.icon}</div>
      <span class="card-badge">${c.badge}</span>
      <div class="card-title">${c.title}</div>
      <div class="card-author">Fatih Sayılan</div>
    </div>
    <div class="card-body">${c.desc}</div>
    <div class="card-btns">
      ${c.start
        ? `<a href="${c.start}" class="btn-start">▶ Teste Başla</a>`
        : c.pdf
          ? `<a href="${c.pdf}" target="_blank" rel="noopener" class="btn-pdf">📄 PDF'yi Aç</a>`
          : `<a href="${c.goto}" target="_blank" rel="noopener" class="btn-goto">${c.btnLabel || "📄 Drive'da Aç"}</a>`
      }
      <button class="btn-copy" onclick="copyLink('${c.start || link}', this)">🔗 Linki Kopyala</button>
    </div>`;
  grid.appendChild(card);
});
</script>
