<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Segoe UI', Arial, sans-serif;
  background: #e8edf2;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 14px 8px 80px;
}

.color-bar, .color-bar-bottom, .page {
  width: calc(100% - 20px);
  max-width: 1900px;
}
.color-bar, .color-bar-bottom {
  display: flex; height: 13px; overflow: hidden;
}
.color-bar { border-radius: 8px 8px 0 0; }
.color-bar-bottom { border-radius: 0 0 8px 8px; margin-top: -1px; }
.cb1 { background: #EF9A9A; flex: 1; }
.cb2 { background: #A5D6A7; flex: 1; }
.cb3 { background: #90CAF9; flex: 1; }
.cb4 { background: #FFF176; flex: 1; }

.page {
  background: #fff;
  border-radius: 0 0 18px 18px;
  box-shadow: 0 8px 40px rgba(0,0,0,0.13);
  overflow: hidden;
  flex: 1;
  display: flex;
  flex-direction: column;
}

/* ── Header ── */
.page-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 20px 12px;
  border-bottom: 2px solid #f0f0f0;
  gap: 10px;
  flex-shrink: 0;
}
.nav-links {
  display: flex; align-items: center; gap: 6px;
  font-size: 13px; font-weight: 700; color: #aaa; flex-shrink: 0;
}
.nav-links a { color: #1565C0; text-decoration: none; font-weight: 700; transition: color 0.15s; }
.nav-links a:hover { color: #FF5722; }
.nav-sep { color: #ccc; font-size: 15px; }
.page-title { text-align: center; flex: 1; }
.page-title .unit-label { font-size: 12px; font-weight: 700; color: #aaa; letter-spacing: 1px; text-transform: uppercase; }
.page-title h1 { font-size: 22px; font-weight: 900; color: #0a0f4a; line-height: 1.2; }
.canbay-btn {
  font-size: 13px; font-weight: 800; color: #E53935;
  text-decoration: none; background: #fff;
  border: 2px solid #E53935; border-radius: 8px;
  padding: 6px 14px; transition: all 0.18s;
  white-space: nowrap; flex-shrink: 0;
}
.canbay-btn:hover { background: #FFEBEE; transform: translateY(-1px); }
.fullscreen-btn {
  font-size: 13px; font-weight: 800; color: #1565C0;
  background: #fff; border: 2px solid #1565C0;
  border-radius: 8px; padding: 6px 14px; cursor: pointer;
  font-family: inherit; transition: all 0.18s;
  white-space: nowrap; flex-shrink: 0;
}
.fullscreen-btn:hover { background: #E3F2FD; transform: translateY(-1px); }

/* ── Card viewer ── */
.card-viewer {
  display: flex;
  flex: 1;
  min-height: 0;
}

/* Left: image */
.img-panel {
  flex: 2;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #f5f7fa;
  padding: 20px;
  border-right: 2px solid #f0f0f0;
  overflow: hidden;
}
.card-img {
  width: 100%;
  height: 100%;
  max-width: 100%;
  max-height: 600px;
  object-fit: contain;
  border-radius: 12px;
  box-shadow: 0 6px 24px rgba(0,0,0,0.12);
  transition: opacity 0.3s ease;
}
.card-img.fade { opacity: 0; }

/* Right: word panel */
.word-panel {
  flex: 3;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding: 32px 24px;
  gap: 20px;
  background: #fff;
  min-width: 260px;
}

.word-counter {
  font-size: 13px; font-weight: 700; color: #bbb;
  letter-spacing: 1px;
}

.word-en-wrap {
  display: flex;
  align-items: center;
  gap: 14px;
  text-align: center;
}
.word-en {
  font-size: 42px;
  font-weight: 900;
  color: #1a237e;
  line-height: 1.2;
  text-align: center;
}
.speak-btn {
  background: #E3F2FD;
  border: 2px solid #BBDEFB;
  border-radius: 50%;
  width: 52px; height: 52px;
  font-size: 22px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.18s;
  flex-shrink: 0;
}
.speak-btn:hover { background: #BBDEFB; transform: scale(1.08); }
.speak-btn:active { transform: scale(0.95); }

.word-tr {
  font-size: 26px;
  font-weight: 700;
  color: #888;
  text-align: center;
}

.word-sentence-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  max-width: 480px;
  width: 100%;
}
.word-sentence {
  font-size: 21px;
  color: #333;
  text-align: center;
  line-height: 1.6;
  padding: 10px 16px;
  background: #F0F4FF;
  border-left: 3px solid #90CAF9;
  border-radius: 8px;
  width: 100%;
}
.word-sentence-tr {
  font-size: 19px;
  color: #555;
  font-style: italic;
  text-align: center;
}
.word-sentence-wrap.hidden { visibility: hidden; }

.nav-btns {
  display: flex;
  gap: 12px;
  margin-top: auto;
  margin-bottom: 80px;
}
.nav-btn {
  border: none; border-radius: 10px;
  font-size: 15px; font-weight: 800;
  padding: 12px 28px;
  cursor: pointer; font-family: inherit;
  transition: all 0.18s;
}
.btn-prev { background: #F5F5F5; color: #555; border: 1.5px solid #E0E0E0; }
.btn-prev:hover { background: #EEEEEE; }
.btn-prev:disabled { opacity: 0.35; cursor: default; }
.btn-next { background: #1565C0; color: #fff; }
.btn-next:hover { background: #0D47A1; }
.btn-next:disabled { opacity: 0.35; cursor: default; }

/* ── Fixed bottom bar ── */
.bottom-bar {
  position: fixed;
  bottom: 0; left: 0;
  width: 100%;
  z-index: 9999;
  background: #fff;
  border-top: 3px solid #7B1C1C;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 10px 20px;
  box-shadow: 0 -3px 16px rgba(0,0,0,0.15);
}
.bar-btn {
  border: none; border-radius: 8px;
  font-size: 14px; font-weight: 800;
  padding: 8px 18px;
  cursor: pointer; font-family: inherit;
  transition: all 0.18s; white-space: nowrap;
}
.bar-btn-fs { background: #7B1C1C; color: #fff; border: 2px solid #7B1C1C; }
.bar-btn-fs:hover { background: #5D1010; border-color: #5D1010; }
.bar-btn-zoom { background: transparent; color: #7B1C1C; border: 2px solid rgba(123,28,28,0.4); font-size: 18px; padding: 6px 16px; }
.bar-btn-zoom:hover { background: rgba(123,28,28,0.08); border-color: #7B1C1C; }
.bar-zoom-label { color: #555; font-size: 13px; font-weight: 700; min-width: 40px; text-align: center; }
.bar-divider { width: 1px; height: 32px; background: rgba(123,28,28,0.2); flex-shrink: 0; }
.bar-btn-draw { background: transparent; color: #333; border: 2px solid rgba(0,0,0,0.2); font-size: 13px; padding: 7px 14px; gap: 5px; display: flex; align-items: center; }
.bar-btn-draw:hover { background: rgba(0,0,0,0.06); border-color: #555; }
.bar-btn-draw.active { background: #7B1C1C; color: #fff; border-color: #7B1C1C; }
.bar-btn-draw.active-highlight { background: #FFF176; color: #333; border-color: #e6c800; }
.bar-btn-clear { background: transparent; color: #C62828; border: 2px solid rgba(198,40,40,0.35); font-size: 13px; padding: 7px 14px; }
.bar-btn-clear:hover { background: rgba(198,40,40,0.08); border-color: #C62828; }
.bar-btn-end { background: #7B1C1C; color: #fff; border: 2px solid #7B1C1C; font-size: 13px; padding: 7px 14px; }
.bar-btn-end:hover { background: #5D1010; border-color: #5D1010; }
.bar-btn-home { background: transparent; color: #7B1C1C; border: 2px solid rgba(123,28,28,0.4); border-radius: 8px; font-size: 20px; padding: 5px 12px; text-decoration: none; transition: all 0.18s; line-height: 1; }
.bar-btn-home:hover { background: rgba(123,28,28,0.08); border-color: #7B1C1C; }
.bar-logo { height: 32px; opacity: 0.7; flex-shrink: 0; }
.bar-clock { margin-left: auto; font-size: 18px; font-weight: 800; color: #7B1C1C; letter-spacing: 1px; flex-shrink: 0; }
#drawCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9998; pointer-events: none; cursor: crosshair; }
@media (max-width: 1024px) { .bottom-bar { display: none; } body { padding-bottom: 20px; } }

@media (max-width: 700px) {
  body { padding: 8px 6px 20px; }
  .color-bar, .color-bar-bottom, .page { width: calc(100% - 12px); }
  .card-viewer { flex-direction: column; }
  .img-panel { border-right: none; border-bottom: 2px solid #f0f0f0; padding: 14px; }
  .word-panel { padding: 20px 16px; }
  .word-en { font-size: 28px; }
  .word-tr { font-size: 18px; }
}
</style>

  { img: 'boil.jpg',           en: 'Boil',             tr: 'Kaynatmak',
    sentence: 'The chef boils some water.',
    sentenceTr: '(Aşçı biraz su kaynatır.)' },
  { img: 'bottle.jpg',         en: 'Bottle',           tr: 'Şişe',
    sentence: 'How many bottles of water do you need?',
    sentenceTr: '(Kaç şişe suya ihtiyacın var?)' },
  { img: 'bowl.jpg',           en: 'Bowl',             tr: 'Kase',
    sentence: 'Do you need a bowl for salad?',
    sentenceTr: '(Salata için bir kaseye ihtiyacın var mı?)' },
  { img: 'bread.jpg',          en: 'Bread',            tr: 'Ekmek',
    sentence: 'He likes eating some bread with butter and jam.',
    sentenceTr: '(Tereyağı ve reçel ile biraz ekmek yemeyi sever.)' },
  { img: 'butter.jpg',         en: 'Butter',           tr: 'Tereyağı',
    sentence: 'Do you like butter with jam?',
    sentenceTr: '(Reçel ile tereyağını sever misin?)' },
  { img: 'cake.jpg',           en: 'Cake',             tr: 'Pasta / Kek' },
  { img: 'cheese.jpg',         en: 'Cheese',           tr: 'Peynir',
    sentence: 'I usually eat pasta with cheese on top.',
    sentenceTr: '(Genellikle üzerinde peynir olan makarna yerim.)' },
  { img: 'chocolate.jpg',      en: 'Chocolate',        tr: 'Çikolata',
    sentence: 'I eat chocolate with my coffee.',
    sentenceTr: '(Kahvemle çikolata yerim.)' },
  { img: 'cooker.jpg',         en: 'Cooker',           tr: 'Ocak',
    sentence: 'Heat the mixture on the cooker.',
    sentenceTr: '(Karışımı ocakta ısıtın.)' },
  { img: 'croissant.jpg',      en: 'Croissant',        tr: 'Kruvasan',
    sentence: 'Do you eat croissants with coffee?',
    sentenceTr: '(Kruvasan ile kahve içer misin?)' },
  { img: 'cucumber.jpg',       en: 'Cucumber',         tr: 'Salatalık',
    sentence: 'They want a season salad with fresh cucumber slices.',
    sentenceTr: '(Taze salatalık dilimleriyle bir mevsim salatası istiyorlar.)' },
  { img: 'cup.jpg',            en: 'Cup',              tr: 'Fincan',
    sentence: 'I drink a cup of Turkish coffee in the mornings.',
    sentenceTr: '(Sabahları bir fincan Türk kahvesi içerim.)' },
  { img: 'cut.jpg',            en: 'Cut',              tr: 'Kesmek',
    sentence: 'She cut the tomatoes into small pieces for the salad.',
    sentenceTr: '(Salata için domatesleri küçük parçalara kesti.)' },
  { img: 'dish.jpg',           en: 'Dish',             tr: 'Yemek / Tabak' },
  { img: 'eggs.jpg',           en: 'Eggs',             tr: 'Yumurta',

    sentenceTr: '(Bir bardak meyve suyu içmek istiyorum.)' },
  { img: 'fry.jpg',            en: 'Fry',              tr: 'Kızartmak',
    sentence: 'Fry the dough in hot oil until it turns golden brown.',

  { img: 'glass.jpg',          en: 'Glass',            tr: 'Bardak',
    sentence: 'A glass of water, please.',
    sentenceTr: '(Bir bardak su, lütfen.)' },
  { img: 'grilled-chicken.jpg',en: 'Grilled chicken',  tr: 'Izgara tavuk',
    sentence: 'I prefer grilled chicken instead of beef.',
    sentenceTr: '(Dana eti yerine ızgara tavuğu tercih ediyorum.)' },

  { img: 'lemon.jpg',          en: 'Lemon',            tr: 'Limon',

  { img: 'mushroom.jpg',       en: 'Mushroom',         tr: 'Mantar' },
  { img: 'nuts.jpg',           en: 'Nuts',             tr: 'Kuruyemiş' },
  { img: 'oil.jpg',            en: 'Oil',              tr: 'Yağ' },
  { img: 'olives.jpg',         en: 'Olives',           tr: 'Zeytin' },
  { img: 'pan.jpg',            en: 'Pan',              tr: 'Tava' },
  { img: 'pasta.jpg',          en: 'Pasta',            tr: 'Makarna' },
  { img: 'plate.jpg',          en: 'Plate',            tr: 'Tabak' },
  { img: 'pot.jpg',            en: 'Pot',              tr: 'Tencere' },
  { img: 'salad.jpg',          en: 'Salad',            tr: 'Salata' },
  { img: 'salt.jpg',           en: 'Salt',             tr: 'Tuz' },
  { img: 'soda-water.jpg',     en: 'Soda water',       tr: 'Soda' },
  { img: 'sweets.jpg',         en: 'Sweets',           tr: 'Şekerleme' },
  { img: 'table.jpg',          en: 'Table',            tr: 'Masa' },
  { img: 'tablespoon.jpg',     en: 'Tablespoon',       tr: 'Yemek kaşığı' },
  { img: 'tomato.jpg',         en: 'Tomato',           tr: 'Domates' },
  { img: 'wash.jpg',           en: 'Wash',             tr: 'Yıkamak' },
];

let current = 0;

function speak() {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(WORDS[current].en);
  u.lang = 'en-US';
  u.rate = 0.85;
  window.speechSynthesis.speak(u);
}

function showCard(index, autoSpeak = true) {
  const w = WORDS[index];
  const img = document.getElementById('cardImg');
  img.classList.add('fade');
  setTimeout(() => {
    img.onload = () => img.classList.remove('fade');
    img.src = w.img;
    img.alt = w.en;
  }, 300);
  document.getElementById('wordEn').textContent = w.en;
  document.getElementById('wordTr').textContent = w.tr;
  document.getElementById('wordCounter').textContent = `${index + 1} / ${WORDS.length}`;
  document.getElementById('btnPrev').disabled = index === 0;
  document.getElementById('btnNext').disabled = index === WORDS.length - 1;
  const wrap = document.getElementById('wordSentenceWrap');
  if (w.sentence) {
    document.getElementById('wordSentence').textContent = w.sentence;
    document.getElementById('wordSentenceTr').textContent = w.sentenceTr || '';
    wrap.classList.remove('hidden');
  } else {
    wrap.classList.add('hidden');
  }
  if (autoSpeak) setTimeout(speak, 350);
}

function go(dir) {
  const next = current + dir;
  if (next < 0 || next >= WORDS.length) return;
  current = next;
  showCard(current);
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') go(1);
  if (e.key === 'ArrowLeft')  go(-1);
  if ((e.ctrlKey || e.metaKey) && ['a','c','s','u','p'].includes(e.key.toLowerCase())) e.preventDefault();
  if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && ['i','j','c'].includes(e.key.toLowerCase()))) e.preventDefault();
});

document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('selectstart', e => e.preventDefault());
document.addEventListener('copy',        e => e.preventDefault());
document.addEventListener('cut',         e => e.preventDefault());
document.addEventListener('dragstart',   e => e.preventDefault());

showCard(0);

// ── Fullscreen ──
function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
    document.getElementById('fsBtn').textContent = '✕ Tam Ekrandan Çık';
    document.getElementById('barFsBtn').textContent = '✕ Tam Ekrandan Çık';
  } else {
    document.exitFullscreen();
    document.getElementById('fsBtn').textContent = '⛶ Tam Ekran';
    document.getElementById('barFsBtn').textContent = '⛶ Tam Ekran';
  }
}
document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement) {
    document.getElementById('fsBtn').textContent = '⛶ Tam Ekran';
    document.getElementById('barFsBtn').textContent = '⛶ Tam Ekran';
  }
});

// ── Drawing ──
const canvas = document.getElementById('drawCanvas');
const ctx = canvas.getContext('2d');
let drawing = false, currentTool = null, hlSnapshot = null, hlPath = [];
function resizeCanvas() {
  const tmp = canvas.toDataURL();
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  const i = new Image(); i.onload = () => ctx.drawImage(i, 0, 0); i.src = tmp;
}
window.addEventListener('resize', resizeCanvas); resizeCanvas();
function setTool(tool) {
  if (currentTool === tool) { endDrawing(); return; }
  currentTool = tool; canvas.style.pointerEvents = 'auto';
  ['btnPen','btnHighlight','btnEraser'].forEach(id => document.getElementById(id).classList.remove('active','active-highlight'));
  if (tool === 'pen')       document.getElementById('btnPen').classList.add('active');
  if (tool === 'highlight') document.getElementById('btnHighlight').classList.add('active-highlight');
  if (tool === 'eraser')    document.getElementById('btnEraser').classList.add('active');
  canvas.style.cursor = tool === 'eraser' ? 'cell' : 'crosshair';
}
function endDrawing() {
  currentTool = null; canvas.style.pointerEvents = 'none'; canvas.style.cursor = 'default';
  ['btnPen','btnHighlight','btnEraser'].forEach(id => document.getElementById(id).classList.remove('active','active-highlight'));
}
function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }
function getPos(e) { const t = e.touches ? e.touches[0] : e; return { x: t.clientX, y: t.clientY }; }
canvas.addEventListener('mousedown', startDraw); canvas.addEventListener('mousemove', moveDraw);
canvas.addEventListener('mouseup', stopDraw); canvas.addEventListener('mouseleave', stopDraw);
canvas.addEventListener('touchstart', e => { e.preventDefault(); startDraw(e); }, { passive: false });
canvas.addEventListener('touchmove',  e => { e.preventDefault(); moveDraw(e);  }, { passive: false });
canvas.addEventListener('touchend', stopDraw);
function startDraw(e) {
  if (!currentTool) return; drawing = true;
  const { x, y } = getPos(e);
  if (currentTool === 'highlight') { hlSnapshot = ctx.getImageData(0, 0, canvas.width, canvas.height); hlPath = [{ x, y }]; }
  else { ctx.beginPath(); ctx.moveTo(x, y); }
}
function moveDraw(e) {
  if (!drawing || !currentTool) return;
  const { x, y } = getPos(e);
  if (currentTool === 'pen') {
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    ctx.strokeStyle = '#E53935'; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.lineTo(x, y); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x, y);
  } else if (currentTool === 'highlight') {
    hlPath.push({ x, y }); ctx.putImageData(hlSnapshot, 0, 0); ctx.save();
    ctx.globalAlpha = 0.28; ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = '#FFD600'; ctx.lineWidth = 22; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(hlPath[0].x, hlPath[0].y);
    for (let i = 1; i < hlPath.length; i++) ctx.lineTo(hlPath[i].x, hlPath[i].y);
    ctx.stroke(); ctx.restore();
  } else if (currentTool === 'eraser') {
    ctx.globalCompositeOperation = 'destination-out'; ctx.globalAlpha = 1;
    ctx.lineWidth = 28; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.lineTo(x, y); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x, y);
  }
}
function stopDraw() { hlSnapshot = null; hlPath = []; drawing = false; ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1; }

// ── Zoom ──
let currentZoom = 1.0;
const ZOOM_STEP = 0.1, ZOOM_MIN = 0.5, ZOOM_MAX = 2.0;
function applyZoom() { document.querySelector('.page').style.zoom = currentZoom; document.getElementById('zoomLabel').textContent = Math.round(currentZoom * 100) + '%'; }
function zoomIn()  { if (currentZoom < ZOOM_MAX) { currentZoom = Math.round((currentZoom + ZOOM_STEP) * 10) / 10; applyZoom(); } }
function zoomOut() { if (currentZoom > ZOOM_MIN) { currentZoom = Math.round((currentZoom - ZOOM_STEP) * 10) / 10; applyZoom(); } }

// ── Clock ──
function updateClock() {
  const now = new Date();
  document.getElementById('barClock').textContent = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
}
updateClock(); setInterval(updateClock, 1000);
