// ── Audio ──
function playSound(type) {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (type === 'correct') {
    const notes = [523, 659, 784]; // C5 E5 G5
    notes.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'sine'; osc.frequency.value = freq;
      const t = ctx.currentTime + i * 0.12;
      gain.gain.setValueAtTime(0.4, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
      osc.start(t); osc.stop(t + 0.25);
    });
  } else {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = 'sawtooth'; osc.frequency.value = 180;
    gain.gain.setValueAtTime(0.4, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
    osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.35);
  }
}

  { id:'shark',     name:'Shark',     side:'right',
    clues:['It lives in the ocean.','It has very sharp teeth.','It has a big fin on its back.','It is a dangerous fish.'] },
  { id:'snake',     name:'Snake',     side:'right',
    clues:['It is a very long animal.','It slithers on the ground.','It has no legs.','It can be dangerous and it hisses.'] },
  { id:'turtle',    name:'Turtle',    side:'right',
    clues:['It carries a hard shell on its back.','It moves very slowly.','It can live in the sea.','It is green.'] },
  { id:'whale',     name:'Whale',     side:'right',
    clues:['It lives in the ocean.','It is the biggest animal in the world.','It is a mammal, not a fish.','It blows water from the top of its head.'] },
  { id:'zebra',     name:'Zebra',     side:'right',
    clues:['It has black and white stripes.','It looks like a striped horse.','It lives on the African savannah.','No two of them have the same stripe pattern.'] },
];
const POINTS = [10, 8, 6, 4];
const GAME_SEC = 60;
const LS_KEY = 'taboo_scores_v1';
const LS_PNUM = 'taboo_playerNum';
const EXPIRY_MS = 15 * 864e5;

// ── State ──
let queue = [], currentAnimal = null, currentClueIdx = 0;
let score = 0, animalsAnswered = 0, wrongAttempts = 0;
let timerSec = GAME_SEC, timerInterval = null;
let gameActive = false, playerName = '';
let failedAnimalId = null;
const MAX_WRONG = 3;

// ── Build Panels ──
function buildPanels() {
  const L = document.getElementById('leftPanel');
  const R = document.getElementById('rightPanel');
  L.innerHTML = R.innerHTML = '';
  ANIMALS.forEach(a => {
    const el = document.createElement('div');
    el.className = 'animal-card inactive';
    el.id = 'card-' + a.id;
    el.dataset.id = a.id;
    el.onclick = () => guessAnimal(a.id);
    el.innerHTML = `<img src="${a.id}.png" alt="${a.name}" draggable="false"><div class="animal-label">${a.name}</div>`;
    (a.side === 'left' ? L : R).appendChild(el);
  });
}

// ── Leaderboard ──
function getScores() {
  try {
    const raw = JSON.parse(localStorage.getItem(LS_KEY) || '[]');
    return raw.filter(s => Date.now() - s.date < EXPIRY_MS);
  } catch { return []; }
}
function saveScore(name, pts) {
  let all = getScores();
  all.push({ name, score: pts, date: Date.now() });
  all.sort((a,b) => b.score - a.score);
  localStorage.setItem(LS_KEY, JSON.stringify(all.slice(0, 50)));
}
function renderLeaderboard() {
  const list = document.getElementById('lbList');
  const top = getScores().slice(0, 5);
  const medals = ['🥇','🥈','🥉','4️⃣','5️⃣'];
  if (!top.length) { list.innerHTML = '<li class="lb-empty">Henüz skor yok.</li>'; return; }
  list.innerHTML = top.map((s,i) =>
    `<li class="lb-item"><span class="lb-rank">${medals[i]}</span><span class="lb-name">${esc(s.name)}</span><span class="lb-score">${s.score} pts</span></li>`
  ).join('');
}
function clearScores() {
  if (!confirm('Tüm puan tablosunu silmek istediğine emin misin?')) return;
  localStorage.removeItem(LS_KEY);
  renderLeaderboard();
}
function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── Player num ──
function getDefaultName() {
  return 'Player ' + (parseInt(localStorage.getItem(LS_PNUM)||'1',10));
}
function bumpPlayerNum() {
  localStorage.setItem(LS_PNUM, String(parseInt(localStorage.getItem(LS_PNUM)||'1',10)+1));
}

// ── Shuffle ──
function shuffle(arr) {
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

// ── View ──
function showView(id) {
  ['startView','gameView','endView'].forEach(v =>
    document.getElementById(v).style.display = v===id ? 'flex' : 'none'
  );
}

// ── Start ──
function startGame() {
  playerName = document.getElementById('playerName').value.trim() || getDefaultName();
  score = 0; animalsAnswered = 0; timerSec = GAME_SEC; gameActive = true;
  let shuffled = shuffle([...ANIMALS]);
  // Ensure failed animal isn't first
  if (failedAnimalId && shuffled.length > 1 && shuffled[shuffled.length-1].id === failedAnimalId) {
    [shuffled[0], shuffled[shuffled.length-1]] = [shuffled[shuffled.length-1], shuffled[0]];
  }
  queue = shuffled;
  ANIMALS.forEach(a => { document.getElementById('card-'+a.id).className = 'animal-card'; });
  document.getElementById('hudPlayerName').textContent = playerName;
  updateScoreDisplay(); updateTimerDisplay();
  showView('gameView');
  startTimer();
  nextAnimal();
}

// ── Timer ──
function startTimer() {
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    timerSec--;
    updateTimerDisplay();
    if (timerSec <= 0) { clearInterval(timerInterval); endGame('timeout'); }
  }, 1000);
}
function updateTimerDisplay() {
  const el = document.getElementById('timerDisplay');
  el.textContent = timerSec;
  el.className = 'timer-display' + (timerSec<=10?' danger':timerSec<=20?' warning':'');
}

// ── Animal Turn ──
function nextAnimal() {
  if (!queue.length) { endGame('win'); return; }
  currentAnimal = { ...queue.pop() };
  currentAnimal.clues = shuffle(currentAnimal.clues);
  currentClueIdx = 0;
  wrongAttempts = 0;
  updateLives();
  document.getElementById('progressDisplay').textContent = `${animalsAnswered+1} / 16`;
  refreshClue();
}
function updateLives() {
  const remaining = MAX_WRONG - wrongAttempts;
  document.getElementById('hudLives').textContent = '❤️'.repeat(remaining) + '🖤'.repeat(wrongAttempts);
}
function speakClue(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(text);
  utt.lang = 'en-US';
  utt.rate = 0.9;
  window.speechSynthesis.speak(utt);
}

function refreshClue() {
  const clueText = currentAnimal.clues[currentClueIdx];
  document.getElementById('qClue').textContent   = clueText;
  document.getElementById('qPoints').textContent = POINTS[currentClueIdx] + ' POINTS';
  document.getElementById('qMark').textContent   = '❓';
  document.getElementById('questionCard').style.background = '';
  for (let i=0;i<4;i++) {
    document.getElementById('dot'+i).className = 'clue-dot' +
      (i===currentClueIdx?' active':i<currentClueIdx?' used':'');
  }
  const btn = document.getElementById('nextClueBtn');
  btn.disabled = currentClueIdx >= 3;
  btn.textContent = currentClueIdx>=3 ? '⚠ Last clue — choose carefully!' : 'Next Clue →';
  speakClue(clueText);
}
function nextClue() {
  if (currentClueIdx>=3 || !gameActive) return;
  currentClueIdx++;
  refreshClue();
}

// ── Guess ──
function guessAnimal(id) {
  if (!gameActive || !currentAnimal) return;
  const card = document.getElementById('card-'+id);
  if (id === currentAnimal.id) {
    const pts = POINTS[currentClueIdx];
    score += pts; animalsAnswered++;
    updateScoreDisplay();
    card.className = 'animal-card correct';
    playSound('correct');
    // Green flash on question card
    document.getElementById('questionCard').style.background = 'linear-gradient(160deg,#1B5E20,#2E7D32)';
    document.getElementById('qMark').textContent  = '✅';
    document.getElementById('qClue').textContent  = '+'+pts+' points!';
    document.getElementById('progressDisplay').textContent = animalsAnswered + ' / 16';
    // Reset timer for next animal
    timerSec = GAME_SEC;
    updateTimerDisplay();
    setTimeout(nextAnimal, 900);
  } else {
    card.classList.add('wrong-flash');
    setTimeout(() => card.classList.remove('wrong-flash'), 450);
    playSound('wrong');
    wrongAttempts++;
    updateLives();
    if (wrongAttempts >= MAX_WRONG) {
      setTimeout(() => endGame('miss'), 400);
    }
  }
}
function updateScoreDisplay() {
  document.getElementById('scoreDisplay').textContent = score;
}

// ── End ──
function endGame(reason) {
  clearInterval(timerInterval);
  gameActive = false;
  failedAnimalId = (reason==='miss' && currentAnimal) ? currentAnimal.id : null;
  ANIMALS.forEach(a => {
    const c = document.getElementById('card-'+a.id);
    if (!c.classList.contains('correct')) c.className = 'animal-card inactive';
  });
  saveScore(playerName, score);
  bumpPlayerNum();
  renderLeaderboard();
  document.getElementById('playerName').value = getDefaultName();
  const cfg = {
    win:     { icon:'🏆', title:'Amazing! All Done!',  sub:`All 16 animals guessed! 🎉` },
    timeout: { icon:'⏰', title:"Time's Up!",           sub:`You guessed ${animalsAnswered} animal${animalsAnswered!==1?'s':''}.` },
    miss:    { icon:'😅', title:'Game Over!',           sub:`Wrong answer! The animal was "${currentAnimal?.name}".` },
  };
  const c = cfg[reason];
  document.getElementById('endIcon').textContent       = c.icon;
  document.getElementById('endTitle').textContent      = c.title;
  document.getElementById('endSub').textContent        = c.sub;
  document.getElementById('endPlayerName').textContent = playerName;
  document.getElementById('endScore').textContent      = score + ' pts';
  showView('endView');
}

// ── Finish ──
function finishGame() {
  if (!gameActive) return;
  if (!confirm('Oyundan çıkmak istediğine emin misin?')) return;
  endGame('timeout');
}

// ── Play Again ──
function playAgain() {
  ANIMALS.forEach(a => { document.getElementById('card-'+a.id).className = 'animal-card inactive'; });
  renderLeaderboard();
  showView('startView');
}

// ── Init ──
buildPanels();
document.getElementById('playerName').value = getDefaultName();
renderLeaderboard();
showView('startView');

// ── Fullscreen ──
function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(()=>{});
    document.getElementById('fsBtn').textContent = '✕ Tam Ekrandan Çık';
    document.getElementById('barFsBtn').textContent = '✕ Tam Ekrandan Çık';
  } else {
    document.exitFullscreen();
    document.getElementById('fsBtn').textContent = '⛶ Tam Ekran';
    document.getElementById('barFsBtn').textContent = '⛶ Tam Ekran';
  }
}
document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement) {
    document.getElementById('fsBtn').textContent = '⛶ Tam Ekran';
    document.getElementById('barFsBtn').textContent = '⛶ Tam Ekran';
  }
});

// ── Drawing ──
const canvas = document.getElementById('drawCanvas');
const ctx = canvas.getContext('2d');
let drawing=false, currentTool=null, hlSnapshot=null, hlPath=[];
function resizeCanvas(){const t=canvas.toDataURL();canvas.width=window.innerWidth;canvas.height=window.innerHeight;const i=new Image();i.onload=()=>ctx.drawImage(i,0,0);i.src=t;}
window.addEventListener('resize',resizeCanvas);resizeCanvas();
function setTool(tool){if(currentTool===tool){endDrawing();return;}currentTool=tool;canvas.style.pointerEvents='auto';['btnPen','btnHighlight','btnEraser'].forEach(id=>document.getElementById(id).classList.remove('active','active-highlight'));if(tool==='pen')document.getElementById('btnPen').classList.add('active');if(tool==='highlight')document.getElementById('btnHighlight').classList.add('active-highlight');if(tool==='eraser')document.getElementById('btnEraser').classList.add('active');canvas.style.cursor=tool==='eraser'?'cell':'crosshair';}
function endDrawing(){currentTool=null;canvas.style.pointerEvents='none';canvas.style.cursor='default';['btnPen','btnHighlight','btnEraser'].forEach(id=>document.getElementById(id).classList.remove('active','active-highlight'));}
function clearCanvas(){ctx.clearRect(0,0,canvas.width,canvas.height);}
function getPos(e){const t=e.touches?e.touches[0]:e;return{x:t.clientX,y:t.clientY};}
canvas.addEventListener('mousedown',startDraw);canvas.addEventListener('mousemove',moveDraw);canvas.addEventListener('mouseup',stopDraw);canvas.addEventListener('mouseleave',stopDraw);
canvas.addEventListener('touchstart',e=>{e.preventDefault();startDraw(e);},{passive:false});
canvas.addEventListener('touchmove',e=>{e.preventDefault();moveDraw(e);},{passive:false});
canvas.addEventListener('touchend',stopDraw);
function startDraw(e){if(!currentTool)return;drawing=true;const{x,y}=getPos(e);if(currentTool==='highlight'){hlSnapshot=ctx.getImageData(0,0,canvas.width,canvas.height);hlPath=[{x,y}];}else{ctx.beginPath();ctx.moveTo(x,y);}}
function moveDraw(e){if(!drawing||!currentTool)return;const{x,y}=getPos(e);if(currentTool==='pen'){ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;ctx.strokeStyle='#E53935';ctx.lineWidth=3;ctx.lineCap='round';ctx.lineJoin='round';ctx.lineTo(x,y);ctx.stroke();ctx.beginPath();ctx.moveTo(x,y);}else if(currentTool==='highlight'){hlPath.push({x,y});ctx.putImageData(hlSnapshot,0,0);ctx.save();ctx.globalAlpha=0.28;ctx.globalCompositeOperation='source-over';ctx.strokeStyle='#FFD600';ctx.lineWidth=22;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(hlPath[0].x,hlPath[0].y);for(let i=1;i<hlPath.length;i++)ctx.lineTo(hlPath[i].x,hlPath[i].y);ctx.stroke();ctx.restore();}else if(currentTool==='eraser'){ctx.globalCompositeOperation='destination-out';ctx.globalAlpha=1;ctx.lineWidth=28;ctx.lineCap='round';ctx.lineJoin='round';ctx.lineTo(x,y);ctx.stroke();ctx.beginPath();ctx.moveTo(x,y);}}
function stopDraw(){hlSnapshot=null;hlPath=[];drawing=false;ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;}

// ── Zoom ──
let currentZoom=1.0;
const ZOOM_STEP=0.1,ZOOM_MIN=0.5,ZOOM_MAX=2.0;
function applyZoom(){document.querySelector('.page').style.zoom=currentZoom;document.getElementById('zoomLabel').textContent=Math.round(currentZoom*100)+'%';}
function zoomIn(){if(currentZoom<ZOOM_MAX){currentZoom=Math.round((currentZoom+ZOOM_STEP)*10)/10;applyZoom();}}
function zoomOut(){if(currentZoom>ZOOM_MIN){currentZoom=Math.round((currentZoom-ZOOM_STEP)*10)/10;applyZoom();}}

// ── Clock ──
function updateClock(){const n=new Date();document.getElementById('barClock').textContent=n.getHours().toString().padStart(2,'0')+':'+n.getMinutes().toString().padStart(2,'0');}
updateClock();setInterval(updateClock,1000);
</script>
